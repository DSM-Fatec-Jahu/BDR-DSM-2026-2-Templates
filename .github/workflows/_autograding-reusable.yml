name: "[reusável] Autograding de template"

# Workflow reaproveitável (Fase 5/5B do pipeline de geração de templates).
# Cada aula/atividade tem um workflow "fino" próprio (ex.:
# .github/workflows/autograding-aula-01.yml) que só declara o gatilho
# `pull_request_target` com filtro de path e chama este arquivo via
# `workflow_call`, passando o caminho do template e do script de correção.
#
# Por que `pull_request_target` no workflow chamador (não `pull_request`):
# como todo aluno entrega via fork + PR, um workflow disparado por
# `pull_request` de um fork sempre recebe um GITHUB_TOKEN somente-leitura —
# não dá para comentar no PR nem aplicar label. `pull_request_target` roda
# com o token do repositório de origem (leitura/escrita) e SEMPRE usa o
# arquivo de workflow da branch base (o conteúdo do fork não pode alterar a
# lógica do autograding). O único conteúdo do fork que este workflow lê é o
# arquivo de entrega (Markdown/SQL) puramente como TEXTO, através de um
# parser próprio (regex) — nunca executamos nada que venha do fork. Ver
# docs/decisoes-arquiteturais.md para o raciocínio completo.

on:
  workflow_call:
    inputs:
      template-path:
        description: "Caminho do template a partir da raiz do repo, ex.: templates/aula-01-modelagem-conceitual-mer"
        required: true
        type: string
      template-slug:
        description: "Identificador curto do alvo, usado como label do PR, ex.: aula-01"
        required: true
        type: string
      entrega-relativa:
        description: "Caminho do arquivo de entrega, relativo ao template"
        required: true
        type: string
      avaliador-relativo:
        description: "Caminho do script de correção, relativo ao template"
        required: true
        type: string
    secrets:
      NOTAS_REPO_TOKEN:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  autograding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do conteúdo do PR (fork) — só leitura, nada é executado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar correção automática
        id: correcao
        run: |
          python "${{ inputs.template-path }}/${{ inputs.avaliador-relativo }}" \
            --entrega "${{ inputs.template-path }}/${{ inputs.entrega-relativa }}" \
            --saida-json "${{ inputs.template-path }}/resultado.json"

      - name: Extrair identificação do aluno e comentar/rotular o PR
        id: identificacao
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const templatePath = "${{ inputs.template-path }}";
            const templateSlug = "${{ inputs.template-slug }}";
            const resultado = JSON.parse(fs.readFileSync(`${templatePath}/resultado.json`, 'utf8'));

            const body = context.payload.pull_request.body || "";
            const extrair = (rotulo) => {
              const re = new RegExp(`\\*\\*${rotulo}:\\*\\*\\s*(.+)`, 'i');
              const m = body.match(re);
              return m ? m[1].replace(/<!--.*?-->/g, '').trim() : "";
            };
            const ra = extrair('RA');
            const nome = extrair('Nome completo');
            const usuarioInformado = extrair('Usuário GitHub').replace(/^@/, '');
            const usuarioReal = context.payload.pull_request.user.login;
            const identificacaoOk = ra.length > 0 && nome.length > 0 &&
              usuarioInformado.toLowerCase() === usuarioReal.toLowerCase();

            core.setOutput('ra', ra);
            core.setOutput('nome', nome);
            core.setOutput('usuario', usuarioReal);
            core.setOutput('identificacao_ok', String(identificacaoOk));
            core.setOutput('nota', String(resultado.geral.nota));
            core.setOutput('aprovados', String(resultado.geral.aprovados));
            core.setOutput('total_criterios', String(resultado.geral.total_criterios));

            let avisoIdentificacao = "";
            if (!identificacaoOk) {
              avisoIdentificacao = [
                "> ⚠️ **Identificação incompleta ou inconsistente no corpo do PR.**",
                "> Confira se os campos **RA**, **Nome completo** e **Usuário GitHub** do",
                "> template do Pull Request foram preenchidos, e se o Usuário GitHub",
                `> informado ("${usuarioInformado || '(vazio)'}") bate com quem realmente`,
                `> abriu este PR (**@${usuarioReal}**). Isso não impede a correção, mas`,
                "> pode atrapalhar o professor a localizar sua nota no painel consolidado.",
                "",
              ].join("\n");
            }

            const marcador = `<!-- autograding:${templateSlug} -->`;

            // Reconstitui o relatório em Markdown a partir do JSON (o step
            // anterior já imprimiu a mesma informação no stdout/job summary).
            function relatorioParte(titulo, parte) {
              const linhas = [
                `## ${titulo}`,
                "",
                `**Nota (referência formativa):** ${parte.nota} / 10 (${parte.aprovados}/${parte.total_criterios} critérios atendidos)`,
                "",
              ];
              for (const c of parte.criterios) {
                linhas.push(`- ${c.passou ? "✅" : "❌"} **${c.nome}** — ${c.detalhe}`);
              }
              return linhas.join("\n");
            }

            const textoCompleto = [
              marcador,
              `# Resultado da correção automática — ${templateSlug}`,
              "",
              avisoIdentificacao,
              `**Aluno:** @${usuarioReal}${ra ? ` · RA ${ra}` : ""}`,
              "",
              relatorioParte("Parte 1", resultado.parte_1),
              "",
              relatorioParte("Parte 2", resultado.parte_2),
              "",
              `## Nota geral: ${resultado.geral.nota} / 10 (${resultado.geral.aprovados}/${resultado.geral.total_criterios} critérios)`,
            ].join("\n");

            const { data: comentarios } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existente = comentarios.find(c => c.body && c.body.includes(marcador));
            if (existente) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existente.id,
                body: textoCompleto,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: textoCompleto,
              });
            }

            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: templateSlug });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: templateSlug,
                color: "5319e7",
                description: `Entregas do alvo ${templateSlug}`,
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [templateSlug],
            });

      - name: Montar payload agregado
        id: payload
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg aluno "${{ steps.identificacao.outputs.usuario }}" \
            --arg ra "${{ steps.identificacao.outputs.ra }}" \
            --arg nome "${{ steps.identificacao.outputs.nome }}" \
            --arg alvo "${{ inputs.template-slug }}" \
            --arg nota "${{ steps.identificacao.outputs.nota }}" \
            --arg aprovados "${{ steps.identificacao.outputs.aprovados }}" \
            --arg total "${{ steps.identificacao.outputs.total_criterios }}" \
            --arg identificacao_ok "${{ steps.identificacao.outputs.identificacao_ok }}" \
            --arg pr_numero "${{ github.event.pull_request.number }}" \
            --arg pr_url "${{ github.event.pull_request.html_url }}" \
            --arg repositorio "${{ github.repository }}" \
            --arg timestamp "$TIMESTAMP" \
            '{aluno_github: $aluno, ra: $ra, nome: $nome, alvo: $alvo,
              nota: ($nota | tonumber), aprovados: ($aprovados | tonumber),
              total_criterios: ($total | tonumber),
              identificacao_ok: ($identificacao_ok == "true"),
              pr_numero: ($pr_numero | tonumber), pr_url: $pr_url,
              repositorio: $repositorio, timestamp: $timestamp}' > /tmp/payload.json
          cat /tmp/payload.json

      - name: "Enviar resumo para o repositório privado de notas (Fase 5B)"
        env:
          TOKEN: ${{ secrets.NOTAS_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::NOTAS_REPO_TOKEN não configurado neste repositório — o resumo NÃO foi enviado ao painel consolidado do professor (Fase 5B). Veja docs/estrategia-github-education.md."
            exit 0
          fi
          PAYLOAD_DATA=$(jq -c '{event_type: "nova-entrega", client_payload: .}' /tmp/payload.json)
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/BDR-DSM-2026-2-Notas/dispatches" \
            -d "$PAYLOAD_DATA"
