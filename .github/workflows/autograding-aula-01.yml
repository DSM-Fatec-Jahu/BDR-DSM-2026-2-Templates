name: Autograding — Aula 01 — Modelagem Conceitual (MER)

# Ver .github/workflows/_autograding-reusable.yml para a explicação de por
# que este gatilho é `pull_request_target` (não `pull_request`) e por que
# isso é seguro mesmo entregas vindo sempre de forks de alunos.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "templates/aula-01-modelagem-conceitual-mer/**"

jobs:
  autograding:
    uses: ./.github/workflows/_autograding-reusable.yml
    with:
      template-path: templates/aula-01-modelagem-conceitual-mer
      template-slug: aula-01
      entrega-relativa: sql/modelo-conceitual.md
      avaliador-relativo: tests/regras_avaliacao.py
    secrets: inherit
